*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#c9a84c;
  --gold-light:#e8d5a3;
  --gold-dark:#9e7e35;
  --off-white:#faf8f5;
  --warm-white:#f5f1eb;
  --dark:#1a1a1a;

html{scroll-behavior:smooth;}
body{background:var(--off-white);color:var(--dark);font-family:'Montserrat',sans-serif;overflow-x:hidden;}

header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(250,248,245,0.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,0.2);padding:18px 0;}
.header-inner{max-width:1200px;margin:auto;padding:0 40px;display:flex;justify-content:space-between;align-items:center;}
.logo-text{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;letter-spacing:2px;color:var(--dark);text-transform:uppercase;white-space:nowrap;}
.logo-text em{color:var(--gold);font-style:normal;}
.logo-sub{font-size:8px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-top:2px;white-space:nowrap;}
.btn-agendar{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-decoration:none;color:var(--off-white);background:var(--gold);padding:12px 20px;border:1px solid var(--gold);transition:all 0.3s;display:inline-block;white-space:nowrap;}
.btn-agendar:hover{background:transparent;color:var(--gold);}
